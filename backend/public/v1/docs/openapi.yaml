openapi: 3.0.3
info:
  title: Restaurant API
  description: REST API for the restaurant web application. Manages users, categories, menu items, orders, order items and reservations, and provides recipe inspiration from TheMealDB.
  version: 1.0.0
servers:
  - url: http://localhost/RijadTrtic/Web-Programming/backend/rest/index.php
    description: Local XAMPP server
tags:
  - name: auth
  - name: users
  - name: categories
  - name: menu-items
  - name: orders
  - name: order-items
  - name: reservations
  - name: external
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags: [auth]
      summary: Log in and receive a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          token:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/me:
    get:
      tags: [auth]
      summary: Get the currently logged in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users:
    get:
      tags: [users]
      summary: List users (admin)
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [customer, admin, staff]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/email/{email}:
    get:
      tags: [users]
      summary: Find a user by email (admin)
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [users]
      summary: Get a user (admin or the user itself)
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [users]
      summary: Update a user (admin or the user itself, only admin can change role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      summary: Delete a user (admin)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [categories]
      summary: List categories with number of menu items
      security: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [categories]
      summary: Create a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [categories]
      summary: Get a category
      security: []
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [categories]
      summary: Update a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [categories]
      summary: Delete a category without menu items (admin)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /menu-items:
    get:
      tags: [menu-items]
      summary: List menu items with category name, optionally filtered by name
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [menu-items]
      summary: Create a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemInput'
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /menu-items/available:
    get:
      tags: [menu-items]
      summary: List available menu items
      security: []
      responses:
        '200':
          description: List of available menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
  /menu-items/category/{category_id}:
    get:
      tags: [menu-items]
      summary: List menu items in a category
      security: []
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /menu-items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [menu-items]
      summary: Get a menu item
      security: []
      responses:
        '200':
          description: Menu item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [menu-items]
      summary: Update a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemInput'
      responses:
        '200':
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [menu-items]
      summary: Delete a menu item (admin)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /menu-items/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [menu-items]
      summary: Change availability of a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    get:
      tags: [orders]
      summary: List orders (admin sees all, customer sees own)
      parameters:
        - name: status
          in: query
          required: false
          description: Admin only filter
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [orders]
      summary: Place an order. Prices come from the menu and the total is calculated on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/user/{user_id}:
    get:
      tags: [orders]
      summary: List orders of a user (admin or the user itself)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [orders]
      summary: Get an order with user details and items (admin or owner)
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [orders]
      summary: Update an order (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                special_instructions:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [orders]
      summary: Delete an order and its items (admin)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [orders]
      summary: Change order status (admin). Delivered and cancelled orders are final
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [orders]
      summary: Cancel a pending order (admin or owner)
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/items:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [order-items]
      summary: List items of an order (admin or owner)
      responses:
        '200':
          description: List of order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /order-items:
    get:
      tags: [order-items]
      summary: List all order items (admin)
      responses:
        '200':
          description: List of order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [order-items]
      summary: Add an item to a pending order (admin or owner). Price is taken from the menu and the order total is recalculated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemInput'
      responses:
        '201':
          description: Order item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /order-items/most-ordered:
    get:
      tags: [order-items]
      summary: Most ordered menu items (admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Ranking of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    total_ordered:
                      type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /order-items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [order-items]
      summary: Get an order item (admin or owner)
      responses:
        '200':
          description: Order item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [order-items]
      summary: Update an item of a pending order (admin or owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                menu_item_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 50
      responses:
        '200':
          description: Updated order item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [order-items]
      summary: Remove an item from a pending order (admin or owner)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations:
    get:
      tags: [reservations]
      summary: List reservations (admin sees all, customer sees own)
      parameters:
        - name: date
          in: query
          required: false
          description: Admin only filter
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          description: Admin only filter
          schema:
            $ref: '#/components/schemas/ReservationStatus'
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [reservations]
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservations/upcoming:
    get:
      tags: [reservations]
      summary: Upcoming confirmed reservations (admin)
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/user/{user_id}:
    get:
      tags: [reservations]
      summary: List reservations of a user (admin or the user itself)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [reservations]
      summary: Get a reservation (admin or owner)
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [reservations]
      summary: Update a reservation (admin or owner, only admin can change status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [reservations]
      summary: Delete a reservation (admin)
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [reservations]
      summary: Change reservation status (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ReservationStatus'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [reservations]
      summary: Cancel a reservation (admin or owner)
      responses:
        '200':
          description: Cancelled reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /external/recipes/random:
    get:
      tags: [external]
      summary: Random recipe inspiration from TheMealDB
      security: []
      responses:
        '200':
          description: Recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '503':
          $ref: '#/components/responses/ExternalUnavailable'
  /external/recipes/search:
    get:
      tags: [external]
      summary: Search recipes on TheMealDB by name
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 50
          example: pasta
      responses:
        '200':
          description: Matching recipes, empty list when nothing matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ExternalUnavailable'
  /external/recipes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [external]
      summary: Get a recipe from TheMealDB by its ID
      security: []
      responses:
        '200':
          description: Recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ExternalUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Deleted:
      description: Resource deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired token, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User does not have the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExternalUnavailable:
      description: External API is unavailable or timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 6
          example: password123
        phone:
          type: string
          example: '+38761123456'
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@restaurant.com
        password:
          type: string
          example: password123
    UserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
        role:
          type: string
          enum: [customer, admin, staff]
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [customer, admin, staff]
        created_at:
          type: string
        updated_at:
          type: string
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Salads
        description:
          type: string
          example: Fresh seasonal salads
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        item_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    MenuItemInput:
      type: object
      required: [category_id, name, price]
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Caesar Salad
        description:
          type: string
          example: Romaine lettuce, parmesan and croutons
        price:
          type: number
          minimum: 0.01
          example: 9.5
        image_url:
          type: string
          nullable: true
        is_available:
          type: boolean
          example: true
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        category_name:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          example: '9.50'
        image_url:
          type: string
          nullable: true
        is_available:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
        updated_at:
          type: string
    OrderStatus:
      type: string
      enum: [pending, confirmed, preparing, ready, delivered, cancelled]
    OrderInput:
      type: object
      required: [items]
      properties:
        user_id:
          type: integer
          description: Only used when an admin places an order for another user
        special_instructions:
          type: string
          maxLength: 500
          example: No onions please
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menu_item_id]
            properties:
              menu_item_id:
                type: integer
                example: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 50
                example: 2
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        total_amount:
          type: string
          example: '25.98'
        status:
          $ref: '#/components/schemas/OrderStatus'
        order_date:
          type: string
        special_instructions:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    OrderDetails:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            user_name:
              type: string
            user_email:
              type: string
            user_phone:
              type: string
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
    OrderItemInput:
      type: object
      required: [order_id, menu_item_id]
      properties:
        order_id:
          type: integer
          example: 1
        menu_item_id:
          type: integer
          example: 2
        quantity:
          type: integer
          minimum: 1
          maximum: 50
          example: 1
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        menu_item_id:
          type: integer
        item_name:
          type: string
        quantity:
          type: integer
        price:
          type: string
          example: '12.99'
        created_at:
          type: string
    ReservationStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]
    ReservationInput:
      type: object
      required: [reservation_date, reservation_time, guests]
      properties:
        user_id:
          type: integer
          description: Only used when an admin creates a reservation for another user
        reservation_date:
          type: string
          format: date
          example: '2026-12-24'
        reservation_time:
          type: string
          example: '19:30'
          description: Between 10:00 and 22:00
        guests:
          type: integer
          minimum: 1
          maximum: 20
          example: 4
        special_requests:
          type: string
          maxLength: 500
          example: Window seat
        status:
          $ref: '#/components/schemas/ReservationStatus'
    Reservation:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        reservation_date:
          type: string
          format: date
        reservation_time:
          type: string
        guests:
          type: integer
        special_requests:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ReservationStatus'
        created_at:
          type: string
        updated_at:
          type: string
    Recipe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        youtube:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              measure:
                type: string
